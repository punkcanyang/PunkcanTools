<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word2MD - Word 转 Markdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e4e4e7;
      padding: 2rem;
    }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      text-align: center;
      color: #71717a;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    
    .drop-zone {
      border: 2px dashed #3f3f46;
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.02);
    }
    
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #818cf8;
      background: rgba(129, 140, 248, 0.05);
    }
    
    .drop-zone svg { width: 48px; height: 48px; margin-bottom: 1rem; color: #71717a; }
    .drop-zone p { color: #a1a1aa; margin-bottom: 0.5rem; }
    .drop-zone small { color: #52525b; }
    
    .loading { display: none; text-align: center; padding: 2rem; color: #818cf8; }
    .loading.show { display: block; }
    
    .results { display: none; margin-top: 2rem; }
    .results.show { display: block; }
    
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .results-header h2 { font-size: 1rem; color: #a1a1aa; }
    
    .btn-group { display: flex; gap: 0.5rem; }
    
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
    }
    
    .btn-secondary { background: #27272a; color: #a1a1aa; }
    .btn-secondary:hover { background: #3f3f46; }
    
    .file-list { display: flex; flex-direction: column; gap: 1rem; }
    
    .file-item {
      background: #0f0f11;
      border-radius: 12px;
      border: 1px solid #27272a;
      overflow: hidden;
    }
    
    .file-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #18181b;
      cursor: pointer;
    }
    
    .file-item-header:hover { background: #1f1f23; }
    
    .file-item-name {
      font-size: 0.9rem;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .file-item-name svg { width: 16px; height: 16px; color: #818cf8; }
    
    .file-item-actions { display: flex; gap: 0.5rem; }
    
    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 6px;
    }
    
    .file-item-content {
      display: none;
      padding: 1rem;
      max-height: 300px;
      overflow: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border-top: 1px solid #27272a;
    }
    
    .file-item-content.show { display: block; }
    
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #22c55e;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: transform 0.3s ease;
      z-index: 100;
    }
    
    .toast.show { transform: translateX(-50%) translateY(0); }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid #3f3f46;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    .progress-text { margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Word2MD</h1>
    <p class="subtitle">拖拽 Word 文档，即刻转换为 Markdown（支持多文件）</p>
    
    <div class="drop-zone" id="dropZone">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <p>拖拽 .docx 文件到这里（支持多个）</p>
      <small>或点击选择文件</small>
      <input type="file" id="fileInput" accept=".docx" multiple hidden>
    </div>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p class="progress-text" id="progressText">转换中...</p>
    </div>
    
    <div class="results" id="results">
      <div class="results-header">
        <h2 id="resultsTitle">转换结果</h2>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="downloadAll()">全部下载</button>
          <button class="btn btn-secondary" onclick="reset()">重新上传</button>
        </div>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>
  </div>
  
  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const fileList = document.getElementById('fileList');
    const progressText = document.getElementById('progressText');
    const resultsTitle = document.getElementById('resultsTitle');
    const toast = document.getElementById('toast');
    
    let convertedFiles = [];
    
    // 拖拽事件
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.docx'));
      if (files.length > 0) handleFiles(files);
    });
    
    // 点击上传
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) handleFiles(files);
    });
    
    async function handleFiles(files) {
      dropZone.style.display = 'none';
      loading.classList.add('show');
      results.classList.remove('show');
      convertedFiles = [];
      
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        progressText.textContent = `转换中... (${i + 1}/${files.length}) ${file.name}`;
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
          const res = await fetch('/api/convert', {
            method: 'POST',
            body: formData
          });
          
          const data = await res.json();
          
          if (data.success) {
            convertedFiles.push({
              filename: data.filename,
              markdown: data.markdown
            });
          } else {
            convertedFiles.push({
              filename: file.name.replace('.docx', '.md'),
              markdown: `转换失败: ${data.error}`,
              error: true
            });
          }
        } catch (err) {
          convertedFiles.push({
            filename: file.name.replace('.docx', '.md'),
            markdown: `请求失败: ${err.message}`,
            error: true
          });
        }
      }
      
      loading.classList.remove('show');
      renderResults();
    }
    
    function renderResults() {
      const successCount = convertedFiles.filter(f => !f.error).length;
      resultsTitle.textContent = `转换完成 (${successCount}/${convertedFiles.length})`;
      
      fileList.innerHTML = convertedFiles.map((file, index) => `
        <div class="file-item">
          <div class="file-item-header" onclick="toggleContent(${index})">
            <span class="file-item-name">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              ${file.filename}
            </span>
            <div class="file-item-actions">
              <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); copyFile(${index})">复制</button>
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); downloadFile(${index})">下载</button>
            </div>
          </div>
          <div class="file-item-content" id="content-${index}">${escapeHtml(file.markdown)}</div>
        </div>
      `).join('');
      
      results.classList.add('show');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function toggleContent(index) {
      const content = document.getElementById(`content-${index}`);
      content.classList.toggle('show');
    }
    
    function copyFile(index) {
      navigator.clipboard.writeText(convertedFiles[index].markdown);
      showToast('已复制到剪贴板');
    }
    
    function downloadFile(index) {
      const file = convertedFiles[index];
      const blob = new Blob([file.markdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.filename;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function downloadAll() {
      convertedFiles.forEach((file, index) => {
        if (!file.error) {
          setTimeout(() => downloadFile(index), index * 200);
        }
      });
    }
    
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function reset() {
      dropZone.style.display = 'block';
      results.classList.remove('show');
      loading.classList.remove('show');
      fileInput.value = '';
      convertedFiles = [];
    }
  </script>
</body>
</html>
