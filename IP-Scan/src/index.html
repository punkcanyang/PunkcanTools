<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Scanner</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2"/>
                    <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2"/>
                    <line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2"/>
                    <line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
                </svg>
                <h1>IP Scanner</h1>
            </div>
            <p class="subtitle">網路設備掃描工具</p>
        </header>

        <!-- Scan Controls -->
        <section class="controls glass-panel">
            <div class="input-group">
                <label for="network-input">網路區塊</label>
                <div class="input-row">
                    <input 
                        type="text" 
                        id="network-input" 
                        placeholder="例: 192.168.1.0/24 或 192.168.1.1-254"
                        autocomplete="off"
                    />
                    <button id="detect-btn" class="btn btn-secondary" title="自動偵測本機網段">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                            <circle cx="12" cy="20" r="1" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="presets">
                <span class="preset-label">快速選擇:</span>
                <button class="preset-btn" data-suffix="/24">/24 (254 hosts)</button>
                <button class="preset-btn" data-suffix="/25">/25 (126 hosts)</button>
                <button class="preset-btn" data-suffix="/26">/26 (62 hosts)</button>
                <button class="preset-btn" data-suffix="/28">/28 (14 hosts)</button>
            </div>

            <!-- Scan Mode Settings -->
            <div class="scan-modes">
                <span class="preset-label">掃描模式:</span>
                <label class="toggle-item">
                    <input type="checkbox" id="mode-ping" checked disabled />
                    <span class="toggle-label">Ping</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="mode-ports" checked />
                    <span class="toggle-label">端口掃描</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="mode-banner" checked />
                    <span class="toggle-label">Banner</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="mode-os" checked />
                    <span class="toggle-label">OS 偵測</span>
                </label>
            </div>

            <div class="action-buttons">
                <button id="scan-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    開始掃描
                </button>
                <button id="stop-btn" class="btn btn-danger" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                    停止掃描
                </button>
                <div class="action-spacer"></div>
                <button id="save-profile-btn" class="btn btn-secondary" disabled title="保存掃描結果">
                    💾 保存
                </button>
                <button id="load-profile-btn" class="btn btn-secondary" title="載入已保存的檔案">
                    📂 載入
                </button>
            </div>

            <!-- Skip IPs option -->
            <div id="skip-ips-section" class="skip-ips-section" style="display: none;">
                <label class="toggle-item">
                    <input type="checkbox" id="skip-known-ips" />
                    <span class="toggle-label">跳過已掃描的 IP</span>
                </label>
                <span id="skip-profile-name" class="skip-profile-name"></span>
            </div>

            <!-- Nmap Status Bar -->
            <div id="nmap-status" class="nmap-status">
                <div class="nmap-info">
                    <span id="nmap-indicator" class="nmap-indicator"></span>
                    <span id="nmap-text">檢查 nmap 狀態...</span>
                </div>
                <button id="nmap-install-btn" class="btn btn-sm btn-accent" style="display: none;">
                    一鍵安裝 nmap
                </button>
            </div>
        </section>

        <!-- Progress Section -->
        <section id="progress-section" class="progress-section glass-panel" style="display: none;">
            <div class="progress-header">
                <span id="progress-phase">準備中...</span>
                <span id="progress-count">0 / 0</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="progress-stats">
                <div class="stat">
                    <span class="stat-value" id="devices-found">0</span>
                    <span class="stat-label">發現設備</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="scan-time">0s</span>
                    <span class="stat-label">掃描時間</span>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="results-section">
            <div class="results-header">
                <h2>掃描結果</h2>
                <span id="result-count" class="result-count">0 個設備</span>
            </div>
            
            <div id="results-empty" class="results-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <p>輸入網路區塊並點擊「開始掃描」來發現設備</p>
            </div>

            <div id="results-grid" class="results-grid"></div>
        </section>

        <!-- Device Detail Modal -->
        <div id="device-modal" class="modal">
            <div class="modal-content glass-panel">
                <button class="modal-close" id="modal-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div id="modal-body"></div>
            </div>
        </div>

        <!-- Profile Management Modal -->
        <div id="profile-modal" class="modal">
            <div class="modal-content glass-panel">
                <button class="modal-close" id="profile-modal-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div class="modal-device-header">
                    <div class="modal-device-ip">📂 掃描檔案</div>
                    <div class="modal-device-type">管理已保存的掃描結果</div>
                </div>
                <div id="profile-list" class="profile-list"></div>
            </div>
        </div>

        <!-- Save Profile Modal -->
        <div id="save-modal" class="modal">
            <div class="modal-content glass-panel" style="max-width: 400px;">
                <button class="modal-close" id="save-modal-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div class="modal-device-header">
                    <div class="modal-device-ip">💾 保存掃描</div>
                </div>
                <div class="save-form">
                    <div class="input-group">
                        <label for="profile-name-input">檔案名稱</label>
                        <input type="text" id="profile-name-input" placeholder="例: 辦公室網路" />
                    </div>
                    <button id="save-confirm-btn" class="btn btn-primary" style="width: 100%; margin-top: 12px;">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
