[package]
name = "doc-tools"
version = "0.1.0"
description = "Unified document conversion desktop app"
authors = ["punkcan"]
edition = "2021"

[lib]
name = "doc_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
headless_chrome = "1.0"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3"
url = "2"
zip = "2"
